# Universe 647 — Phase 3: Personal Data Layer
# 3 services (baikal, n8n, ntfy)
# Requires: core stack running (PostgreSQL, Caddy, Authelia, networks)

services:

  # ==========================================================================
  # Baikal — Lightweight CalDAV/CardDAV server (iOS sync)
  # NOTE: was the Monica→iOS contacts bridge; orphaned now that Monica is removed.
  # ==========================================================================
  baikal:
    image: ckulka/baikal:0.10.1-nginx
    container_name: baikal
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER      # Required: nginx init scripts fchmod /run/php socket dir
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    # read_only omitted: nginx init scripts need to chmod /run/php socket dir
    # Data is protected by explicit volume mounts; no sensitive writes elsewhere
    environment:
      BAIKAL_SKIP_CHOWN: "true"
    tmpfs:
      - /tmp
      - /run
      - /var/cache/nginx
      - /var/log/nginx
    volumes:
      - /srv/u647/baikal/config:/var/www/baikal/config
      - /srv/u647/baikal/data:/var/www/baikal/Specific
    networks:
      - app_net
    mem_limit: 64m
    cpus: "0.25"
    pids_limit: 64

  # ==========================================================================
  # n8n — Workflow automation
  # SECURITY: Pinned to v1.121.3+ (CVE-2026-21858, CVSS 10.0 — unauth RCE)
  # Reaches services via Caddy authenticated APIs, never direct container access
  # automation_net allows outbound for Gmail, Calendar, Canvas APIs
  # ==========================================================================
  n8n:
    image: n8nio/n8n:1.121.3
    container_name: n8n
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      N8N_HOST: n8n.${DOMAIN}
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.${DOMAIN}/
      GENERIC_TIMEZONE: ${TZ}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_USER_MANAGEMENT_JWT_SECRET: ${N8N_JWT_SECRET}
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      EXTERNAL_HOOK_FILES: /hooks/hooks.js
    volumes:
      - /mnt/data/n8n:/home/node/.n8n
      - ./workflows:/workflows:ro
      - ./n8n/hooks.js:/hooks/hooks.js:ro
    networks:
      - automation_net
      - db_net
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 256

  # ==========================================================================
  # Ntfy — Push notification server
  # Central hub: Uptime Kuma alerts, CrowdSec detections, urgent emails,
  # morning briefings, birthday reminders, MCP confirmations
  # ==========================================================================
  ntfy:
    image: binwiederhier/ntfy:v2.18.0
    container_name: ntfy
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/ntfy
    command:
      - serve
    environment:
      TZ: ${TZ}
      NTFY_BASE_URL: https://ntfy.${DOMAIN}  # Overrides placeholder in server.yml
    volumes:
      - /srv/u647/ntfy:/var/lib/ntfy
      - ./ntfy/server.yml:/etc/ntfy/server.yml:ro
    networks:
      - app_net
    mem_limit: 64m
    cpus: "0.25"
    pids_limit: 64

# ==============================================================================
# Networks
# ==============================================================================
networks:
  # External networks (defined in stacks/core/compose.yaml)
  app_net:
    external: true
  db_net:
    external: true
  automation_net:
    external: true  # Defined in stacks/core/compose.yaml
