components:
  schemas:
    CommandDraft:
      additionalProperties: false
      properties:
        body_md:
          type: string
        defer_at:
          format: date-time
          type: string
        due_at:
          format: date-time
          type: string
        kind:
          description: for type=tag
          type: string
        priority:
          format: int64
          type: integer
        project_id:
          format: int64
          type: integer
        project_name:
          description: unresolved project candidate when project_id is absent
          type: string
        tags:
          items:
            $ref: "#/components/schemas/DraftTag"
          type:
            - array
            - "null"
        title:
          type: string
        type:
          enum:
            - task
            - note
            - tag
          type: string
      required:
        - type
        - title
        - tags
        - priority
      type: object
    CommandInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/schemas/CommandInputBody.json
          format: uri
          readOnly: true
          type: string
        input:
          maxLength: 2000
          minLength: 1
          type: string
      required:
        - input
      type: object
    CommandOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/schemas/CommandOutputBody.json
          format: uri
          readOnly: true
          type: string
        action:
          enum:
            - draft
            - results
          type: string
        draft:
          $ref: "#/components/schemas/CommandDraft"
        hits:
          items:
            $ref: "#/components/schemas/SearchHit"
          type:
            - array
            - "null"
      required:
        - action
      type: object
    CreateNoteInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/schemas/CreateNoteInputBody.json
          format: uri
          readOnly: true
          type: string
        body_md:
          type: string
        tag_ids:
          items:
            format: int64
            type: integer
          type:
            - array
            - "null"
        title:
          maxLength: 500
          minLength: 1
          type: string
      required:
        - title
      type: object
    CreateTagInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/schemas/CreateTagInputBody.json
          format: uri
          readOnly: true
          type: string
        description:
          type: string
        kind:
          default: tag
          enum:
            - project
            - context
            - tag
          type: string
        name:
          maxLength: 120
          minLength: 1
          type: string
        parent_id:
          format: int64
          type: integer
      required:
        - name
        - kind
      type: object
    CreateTaskInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/schemas/CreateTaskInputBody.json
          format: uri
          readOnly: true
          type: string
        body_md:
          type: string
        defer_at:
          format: date-time
          type: string
        due_at:
          format: date-time
          type: string
        priority:
          format: int64
          maximum: 3
          minimum: 0
          type: integer
        project_id:
          format: int64
          type: integer
        tag_ids:
          items:
            format: int64
            type: integer
          type:
            - array
            - "null"
        title:
          maxLength: 500
          minLength: 1
          type: string
      required:
        - title
      type: object
    DraftTag:
      additionalProperties: false
      properties:
        id:
          format: int64
          type: integer
        name:
          type: string
      required:
        - name
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    FolderOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/schemas/FolderOutputBody.json
          format: uri
          readOnly: true
          type: string
        children:
          items:
            $ref: "#/components/schemas/TagDTO"
          type:
            - array
            - "null"
        notes:
          items:
            $ref: "#/components/schemas/NoteDTO"
          type:
            - array
            - "null"
        tag:
          $ref: "#/components/schemas/TagDTO"
        tasks:
          items:
            $ref: "#/components/schemas/TaskDTO"
          type:
            - array
            - "null"
      required:
        - tag
        - children
        - tasks
        - notes
      type: object
    HealthOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/schemas/HealthOutputBody.json
          format: uri
          readOnly: true
          type: string
        status:
          examples:
            - ok
          type: string
      required:
        - status
      type: object
    ListTagsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/schemas/ListTagsOutputBody.json
          format: uri
          readOnly: true
          type: string
        tags:
          items:
            $ref: "#/components/schemas/TagDTO"
          type:
            - array
            - "null"
      required:
        - tags
      type: object
    NoteDTO:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/schemas/NoteDTO.json
          format: uri
          readOnly: true
          type: string
        body_md:
          type: string
        created_at:
          format: date-time
          type: string
        id:
          format: int64
          type: integer
        tags:
          items:
            $ref: "#/components/schemas/TagRef"
          type:
            - array
            - "null"
        title:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - title
        - tags
        - created_at
        - updated_at
      type: object
    ReindexOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/schemas/ReindexOutputBody.json
          format: uri
          readOnly: true
          type: string
        indexed:
          format: int64
          type: integer
        skipped:
          description: unchanged chunks (hash hit, no re-embed)
          format: int64
          type: integer
      required:
        - indexed
        - skipped
      type: object
    SearchHit:
      additionalProperties: false
      properties:
        project:
          type: string
        score:
          format: double
          type: number
        snippet:
          type: string
        source_id:
          format: int64
          type: integer
        source_type:
          enum:
            - task
            - note
            - tag
          type: string
        title:
          type: string
      required:
        - source_type
        - source_id
        - title
        - score
      type: object
    SearchInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/schemas/SearchInputBody.json
          format: uri
          readOnly: true
          type: string
        due_within_days:
          format: int64
          type: integer
        project:
          description: project tag name
          type: string
        query:
          type: string
        tags:
          items:
            type: string
          type:
            - array
            - "null"
        types:
          description: task|note|tag
          items:
            type: string
          type:
            - array
            - "null"
      type: object
    SearchOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/schemas/SearchOutputBody.json
          format: uri
          readOnly: true
          type: string
        hits:
          items:
            $ref: "#/components/schemas/SearchHit"
          type:
            - array
            - "null"
      required:
        - hits
      type: object
    TagDTO:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/schemas/TagDTO.json
          format: uri
          readOnly: true
          type: string
        archived_at:
          format: date-time
          type: string
        description:
          type: string
        id:
          format: int64
          type: integer
        kind:
          enum:
            - project
            - context
            - tag
          type: string
        name:
          type: string
        parent_id:
          format: int64
          type: integer
      required:
        - id
        - name
        - kind
      type: object
    TagRef:
      additionalProperties: false
      properties:
        id:
          format: int64
          type: integer
        name:
          type: string
      required:
        - id
        - name
      type: object
    TaskDTO:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/schemas/TaskDTO.json
          format: uri
          readOnly: true
          type: string
        body_md:
          type: string
        completed_at:
          format: date-time
          type: string
        created_at:
          format: date-time
          type: string
        defer_at:
          format: date-time
          type: string
        due_at:
          format: date-time
          type: string
        id:
          format: int64
          type: integer
        priority:
          format: int64
          type: integer
        project_id:
          format: int64
          type: integer
        project_name:
          type: string
        status:
          enum:
            - open
            - done
          type: string
        tags:
          items:
            $ref: "#/components/schemas/TagRef"
          type:
            - array
            - "null"
        title:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - title
        - status
        - priority
        - tags
        - created_at
        - updated_at
      type: object
    TaskListOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/schemas/TaskListOutputBody.json
          format: uri
          readOnly: true
          type: string
        tasks:
          items:
            $ref: "#/components/schemas/TaskDTO"
          type:
            - array
            - "null"
      required:
        - tasks
      type: object
    TreeNode:
      additionalProperties: false
      properties:
        children:
          items:
            $ref: "#/components/schemas/TreeNode"
          type:
            - array
            - "null"
        id:
          format: int64
          type: integer
        kind:
          enum:
            - project
            - context
          type: string
        name:
          type: string
        note_count:
          format: int64
          type: integer
        task_count:
          format: int64
          type: integer
      required:
        - id
        - name
        - kind
        - task_count
        - note_count
        - children
      type: object
    TreeOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/schemas/TreeOutputBody.json
          format: uri
          readOnly: true
          type: string
        roots:
          items:
            $ref: "#/components/schemas/TreeNode"
          type:
            - array
            - "null"
      required:
        - roots
      type: object
    UpdateNoteInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/schemas/UpdateNoteInputBody.json
          format: uri
          readOnly: true
          type: string
        body_md:
          type: string
        tag_ids:
          description: full replacement set when present
          items:
            format: int64
            type: integer
          type:
            - array
            - "null"
        title:
          maxLength: 500
          type: string
      type: object
    UpdateTagInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/schemas/UpdateTagInputBody.json
          format: uri
          readOnly: true
          type: string
        archived:
          type: boolean
        description:
          type: string
        name:
          maxLength: 120
          type: string
        parent_id:
          format: int64
          type: integer
      type: object
    UpdateTaskInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/schemas/UpdateTaskInputBody.json
          format: uri
          readOnly: true
          type: string
        body_md:
          type: string
        clear_defer_at:
          type: boolean
        clear_due_at:
          type: boolean
        clear_project:
          type: boolean
        defer_at:
          format: date-time
          type: string
        due_at:
          format: date-time
          type: string
        priority:
          format: int64
          maximum: 3
          minimum: 0
          type: integer
        project_id:
          format: int64
          type: integer
        status:
          enum:
            - open
            - done
          type: string
        tag_ids:
          description: full replacement set when present
          items:
            format: int64
            type: integer
          type:
            - array
            - "null"
        title:
          maxLength: 500
          type: string
      type: object
info:
  description: "Retrieval-only second brain: tasks, notes, supertags, hybrid search."
  title: Sophon
  version: 0.2.0
openapi: 3.1.0
paths:
  /api/admin/reindex:
    post:
      operationId: reindex
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReindexOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: "Rebuild the search index (hash-cached: unchanged content is skipped)"
      tags:
        - admin
  /api/command:
    post:
      operationId: command
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Parse a command-bar input into a draft or search results
      tags:
        - command
  /api/folders/{id}:
    get:
      operationId: get-folder
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
        - explode: false
          in: query
          name: include_done
          schema:
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: "Folder contents: child folders, tasks, notes"
      tags:
        - browse
  /api/healthz:
    get:
      operationId: get-healthz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Liveness check
      tags:
        - system
  /api/notes:
    post:
      operationId: create-note
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a note
      tags:
        - notes
  /api/notes/{id}:
    delete:
      operationId: delete-note
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete a note
      tags:
        - notes
    get:
      operationId: get-note
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a note
      tags:
        - notes
    patch:
      operationId: update-note
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNoteInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update a note (partial)
      tags:
        - notes
  /api/search:
    post:
      operationId: search
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Hybrid search (lexical + semantic, RRF-fused)
      tags:
        - search
  /api/tags:
    get:
      operationId: list-tags
      parameters:
        - description: filter by kind
          explode: false
          in: query
          name: kind
          schema:
            description: filter by kind
            enum:
              - project
              - context
              - tag
              - ""
              - ""
            type: string
        - explode: false
          in: query
          name: include_archived
          schema:
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTagsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List tags
      tags:
        - tags
    post:
      operationId: create-tag
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTagInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a tag (project/context/plain)
      tags:
        - tags
  /api/tags/{id}:
    delete:
      operationId: delete-tag
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete a tag
      tags:
        - tags
    patch:
      operationId: update-tag
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTagInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update a tag
      tags:
        - tags
  /api/tasks:
    post:
      operationId: create-task
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a task
      tags:
        - tasks
  /api/tasks/{id}:
    delete:
      operationId: delete-task
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete a task
      tags:
        - tasks
    get:
      operationId: get-task
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a task
      tags:
        - tasks
    patch:
      operationId: update-task
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update a task (partial)
      tags:
        - tasks
  /api/tree:
    get:
      operationId: get-tree
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Project/context folder tree with item counts
      tags:
        - browse
  /api/views/{view}:
    get:
      operationId: get-view
      parameters:
        - in: path
          name: view
          required: true
          schema:
            enum:
              - today
              - upcoming
              - inbox
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: "Smart views: today / upcoming / inbox"
      tags:
        - browse
servers:
  - url: /api
