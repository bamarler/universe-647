components:
  schemas:
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    HealthOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/schemas/HealthOutputBody.json
          format: uri
          readOnly: true
          type: string
        status:
          examples:
            - ok
          type: string
      required:
        - status
      type: object
    TreeNode:
      additionalProperties: false
      properties:
        children:
          items:
            $ref: "#/components/schemas/TreeNode"
          type:
            - array
            - "null"
        id:
          format: int64
          type: integer
        kind:
          enum:
            - project
            - context
          type: string
        name:
          type: string
        note_count:
          format: int64
          type: integer
        task_count:
          format: int64
          type: integer
      required:
        - id
        - name
        - kind
        - task_count
        - note_count
        - children
      type: object
    TreeOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/schemas/TreeOutputBody.json
          format: uri
          readOnly: true
          type: string
        roots:
          items:
            $ref: "#/components/schemas/TreeNode"
          type:
            - array
            - "null"
      required:
        - roots
      type: object
info:
  description: "Retrieval-only second brain: tasks, notes, tags, hybrid search."
  title: Sophon
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/healthz:
    get:
      operationId: get-healthz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Liveness check
      tags:
        - system
  /api/tree:
    get:
      operationId: get-tree
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Project/context folder tree with item counts
      tags:
        - browse
servers:
  - url: /api
