# Universe 647 — Phase 4: Sophon (AI Brain)
# sophon (backend) + bifrost (LLM gateway) + open-webui/mcpo (legacy, retiring)
# + ollama (dormant). Requires: core stack running (PostgreSQL, Caddy, networks)

services:

  # ==========================================================================
  # Sophon — the second-brain backend (Go)
  # Tasks, notes, supertags, hybrid search (pgvector + FTS), retrieval-only AI.
  # Boots even if the gateway is down (semantic features degrade gracefully).
  # Reachable only via Caddy (tomoko.{DOMAIN}/api); trusts Remote-User header.
  # ==========================================================================
  sophon:
    build:
      context: ./app
    container_name: sophon
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/sophon?sslmode=disable
      LLM_BASE_URL: http://bifrost:8080/openai/v1
      LLM_API_KEY: ${BIFROST_VK}
    depends_on:
      # Wait for the gateway on normal boots (sophon's LLM ping is one-shot),
      # but required:false keeps sophon starting in degraded lexical-only mode
      # if bifrost is genuinely broken — browse/CRUD must survive a dead gateway.
      bifrost:
        condition: service_healthy
        required: false
    networks:
      - ai_net   # Bifrost (embeddings + intent parsing)
      - app_net  # Caddy reverse proxy
      - db_net   # PostgreSQL (sophon database)
    mem_limit: 128m
    cpus: "0.5"
    pids_limit: 64

  # ==========================================================================
  # Ollama — Local LLM inference (DORMANT)
  # Disabled for MVP: 7B models can't reliably do MCP tool calls.
  # Re-enable after 32GB RAM upgrade with Qwen 3.5 14B.
  # Start explicitly: docker compose -f stacks/sophon/compose.yaml --profile local up -d ollama
  # ==========================================================================
  ollama:
    image: ollama/ollama:0.6.2
    container_name: ollama
    restart: unless-stopped
    profiles: [local]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    volumes:
      - /mnt/data/ollama/models:/root/.ollama
    networks:
      - ai_net
    mem_limit: 6g
    cpus: "4.0"
    pids_limit: 128

  # ==========================================================================
  # Bifrost — LLM API gateway (Go; replaced LiteLLM, which idled at ~956MiB)
  # Aliases in bifrost/config.json: tool-caller → Gemini 3.1 Flash-Lite,
  # smart → Claude Haiku 4.5. Inbound auth: virtual key (BIFROST_VK).
  # Clients use http://bifrost:8080/openai/v1 with the VK as Bearer token.
  # PIN EXACT VERSIONS: multiple releases/week, translation-layer regressions
  # have shipped before — smoke-test tool calls + embeddings after bumps.
  # ==========================================================================
  bifrost:
    image: maximhq/bifrost:v1.5.11
    container_name: bifrost
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8080"
      LOG_LEVEL: info
      LOG_STYLE: json
      GOMEMLIMIT: 450MiB
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      BIFROST_VK: ${BIFROST_VK}
      BIFROST_ENCRYPTION_KEY: ${BIFROST_ENCRYPTION_KEY}
      BIFROST_ADMIN_USERNAME: ${BIFROST_ADMIN_USERNAME}
      BIFROST_ADMIN_PASSWORD: ${BIFROST_ADMIN_PASSWORD}
    volumes:
      # config.db (governance/virtual-key store) lives in the named volume;
      # config.json entities re-seed it by content hash on every restart
      - bifrost_data:/app/data
      - ./bifrost/config.json:/app/data/config.json:ro
    networks:
      - ai_net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 128

  # ==========================================================================
  # Open WebUI — Legacy chat interface (retiring in the cleanup phase)
  # SECURITY: Pin >= v0.6.35 (CVE-2025-64496 — code injection)
  # Connects to Bifrost for model routing, PostgreSQL for data storage
  # ==========================================================================
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.6.35
    container_name: open-webui
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/open_webui
      OPENAI_API_BASE_URL: http://bifrost:8080/openai/v1
      OPENAI_API_KEY: ${BIFROST_VK}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      ENABLE_SIGNUP: "false"
      DEFAULT_USER_ROLE: admin
      ENABLE_OLLAMA_API: "false"
    volumes:
      - /mnt/data/open-webui:/app/backend/data
    networks:
      - ai_net
      - app_net
      - db_net
    depends_on:
      bifrost:
        condition: service_healthy
    mem_limit: 500m
    cpus: "1.0"
    pids_limit: 256

  # ==========================================================================
  # mcpo — MCP-to-OpenAPI proxy (custom image)
  # Base: ghcr.io/open-webui/mcpo:git-788ff92 (v0.0.20)
  # Adds: monica-mcp built from source (not on npm)
  # Spawns MCP servers (postgres, monica, vikunja) as stdio child processes
  # Config template with env var substitution via entrypoint.sh
  # Multi-homed: ai_net (outbound APIs) + db_net (postgres-mcp direct access)
  # ==========================================================================
  mcpo:
    build:
      context: ./mcpo
    container_name: mcpo
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      MCPO_API_KEY: ${MCPO_API_KEY}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DOMAIN: ${DOMAIN}
      MONICA_API_TOKEN: ${MONICA_API_TOKEN}
      VIKUNJA_API_TOKEN: ${VIKUNJA_API_TOKEN}
    volumes:
      - ./mcpo/config.template.json:/app/config.template.json:ro
    tmpfs:
      - /tmp
    networks:
      - ai_net
      - db_net
    mem_limit: 256m
    cpus: "0.5"
    pids_limit: 128

volumes:
  bifrost_data:

# ==============================================================================
# Networks (defined in stacks/core/compose.yaml)
# ==============================================================================
networks:
  ai_net:
    external: true
  app_net:
    external: true
  db_net:
    external: true
