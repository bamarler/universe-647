# Universe 647 — LiteLLM Model Routing
# Three-tier strategy: tool-caller (cheap), smart (quality), local (dormant)

model_list:
  # Tier 1: Tool Caller — Gemini 3.1 Flash-Lite
  # Fastest TTFT on the market (~180ms) at $0.25/$1.50 per MTok; a 2-tool
  # forced function call needs nothing stronger. Thinking disabled — this
  # route serves an interactive command bar, latency is the product.
  - model_name: tool-caller
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      reasoning_effort: "disable"

  # Tier 2: Smart — Claude Haiku 4.5
  # Best reasoning-per-dollar ($1/$5 per MTok)
  # Used for briefings, email classification, complex reasoning
  - model_name: smart
    litellm_params:
      model: anthropic/claude-haiku-4-5-20250620
      api_key: os.environ/ANTHROPIC_API_KEY

  # Embeddings — Gemini embedding for sophon's search index
  # 768-dim MRL truncation requested by the client (sophon re-normalizes)
  - model_name: gemini-embedding-001
    litellm_params:
      model: gemini/gemini-embedding-001
      api_key: os.environ/GEMINI_API_KEY

  # Tier 3: Local — Ollama (DORMANT)
  # Uncomment after 32GB RAM upgrade + Ollama re-enabled
  # - model_name: local
  #   litellm_params:
  #     model: ollama/qwen3.5:14b
  #     api_base: http://ollama:11434

litellm_settings:
  drop_params: true
  set_verbose: false
  num_retries: 2
  request_timeout: 120

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
